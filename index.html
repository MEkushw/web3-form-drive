<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VED-Enterprise-Products</title>
<style>
  :root {
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --surface-2: #F5F5F4;
    --border: #E7E5E4;
    --ink: #1C1917;
    --muted: #57534E;
    --faint: #A8A29E;
    --accent: #2563EB;
    --accent-soft: #DBEAFE;
    --danger: #B91C1C;
    --danger-soft: #FEE2E2;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0C0A09;
      --surface: #171412;
      --surface-2: #1C1917;
      --border: #292524;
      --ink: #E7E5E4;
      --muted: #A8A29E;
      --faint: #78716C;
      --accent: #3B82F6;
      --accent-soft: rgba(59,130,246,0.14);
      --danger: #F87171;
      --danger-soft: rgba(248,113,113,0.14);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Satoshi", "Geist Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0 20px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 640px; padding-top: 64px; }

  header { margin-bottom: 40px; }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 650;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 12px;
  }
  header .lede { color: var(--muted); max-width: 52ch; font-size: 15px; }
  header .meta {
    margin-top: 16px;
    font-family: "Geist Mono", "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--faint);
    letter-spacing: 0.01em;
  }
  header .meta kbd {
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface-2);
    padding: 1px 6px;
    font-size: 11px;
    color: var(--muted);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
  }

  .entries {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 20px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .nav-btn {
    font-family: inherit;
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 160ms, color 160ms, transform 100ms;
  }
  .nav-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .nav-btn:active:not(:disabled) { transform: scale(0.98); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .dots { display: flex; gap: 6px; flex: 1; justify-content: center; }
  .dot {
    width: 8px; height: 8px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 2px;
    cursor: pointer;
    transition: 160ms;
    padding: 0;
  }
  .dot.filled { background: var(--muted); border-color: var(--muted); }
  .dot.active { background: var(--accent); border-color: var(--accent); }
  .counter {
    font-family: "Geist Mono", "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin-top: 12px;
  }

  form { display: flex; flex-direction: column; gap: 24px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 550;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .field label .hint { font-weight: 400; color: var(--faint); font-size: 12px; }
  input[type="text"], textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--ink);
    padding: 11px 13px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 160ms, box-shadow 160ms;
  }
  textarea { resize: vertical; min-height: 92px; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }

  .dropzone {
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    transition: border-color 160ms, background 160ms;
    color: var(--muted);
    font-size: 13px;
    background: var(--surface-2);
  }
  .dropzone:hover { border-color: var(--accent); color: var(--ink); }
  .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone .file-name { color: var(--accent); font-weight: 550; word-break: break-all; margin-top: 8px; }
  .dropzone input { display: none; }
  .clear-file {
    margin-top: 10px;
    background: var(--danger-soft);
    color: var(--danger);
    border: none;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 550;
    cursor: pointer;
  }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .status { font-size: 13px; color: var(--muted); font-family: "Geist Mono", "SF Mono", "JetBrains Mono", Consolas, monospace; }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 160ms, transform 100ms;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 85%, #000); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .results {
    margin-top: 24px;
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
  }
  .results.show { display: block; }
  .results h3 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--faint);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .results .links { display: flex; flex-direction: column; gap: 8px; }
  .results a {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    word-break: break-all;
  }
  .results a:hover { text-decoration: underline; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(40px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 12px 22px;
    border-radius: 6px;
    font-size: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    transition: transform 300ms cubic-bezier(0.16,1,0.3,1), opacity 300ms;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.err { border-color: var(--danger); color: var(--danger); }

  .reveal {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 600ms cubic-bezier(0.16,1,0.3,1), transform 600ms cubic-bezier(0.16,1,0.3,1);
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .reveal { transition: none; opacity: 1; transform: none; }
  }

  @media (max-width: 560px) {
    .wrap { padding-top: 40px; padding-bottom: 48px; }
    .card { padding: 20px; }
    .entries { flex-wrap: wrap; }
    .dots { order: 3; width: 100%; justify-content: center; margin-top: 4px; }
    .counter { text-align: center; width: 100%; }
    .actions { flex-direction: column; gap: 14px; align-items: stretch; }
    .btn-primary { width: 100%; }
    .status { text-align: center; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="reveal">
    <h1>VED-Enterprise-Products</h1>
    <p class="lede">Capture product details, shade reference and imagery, and archive each entry to your Drive in a single pass.</p>
  </header>

  <div class="card reveal" style="transition-delay:80ms">
    <div class="entries">
      <button class="nav-btn" id="btnBack" type="button">&larr; Back</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="btnNext" type="button">Next &rarr;</button>
      <button class="nav-btn" id="btnAdd" type="button">+ New</button>
    </div>
    <div class="counter" id="counter">Entry 1 of 1</div>

    <form id="form">
      <div class="field">
        <label>Name</label>
        <input type="text" id="name" placeholder="e.g. Aluminium Series 3" autocomplete="off">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="desc" placeholder="Describe this product entry..."></textarea>
      </div>
      <div class="field">
        <label>Shade <span class="hint">(PDF / image)</span></label>
        <div class="dropzone" id="dzShade">
          <div>Drop shade file here or click to upload</div>
          <div class="file-name" id="shadeName"></div>
          <button type="button" class="clear-file" id="clearShade" hidden>&times; remove file</button>
          <input type="file" id="shade" accept=".pdf,image/*">
        </div>
      </div>
      <div class="field">
        <label>Picture <span class="hint">(image)</span></label>
        <div class="dropzone" id="dzPicture">
          <div>Drop picture here or click to upload</div>
          <div class="file-name" id="picName"></div>
          <button type="button" class="clear-file" id="clearPic" hidden>&times; remove file</button>
          <input type="file" id="picture" accept="image/*">
        </div>
      </div>

      <div class="actions">
        <span class="status" id="status"></span>
        <button type="submit" class="btn btn-primary" id="submitBtn">Submit All to Drive</button>
      </div>
    </form>
  </div>

  <div class="results reveal" id="results" style="transition-delay:140ms">
    <h3>Last submission - saved links</h3>
    <div class="links" id="resultsLinks"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ CONFIG ============
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0QoedkrDIDuyg3IZQaPpK772mTEbhVZObvsEgLh9Zt1GvB5nIILk3gKyxM_O7n6Fh8w/exec";
const DRIVE_FOLDER_ID = "REPLACE_WITH_YOUR_DRIVE_FOLDER_ID";
// ================================

const entries = [];
let current = 0;
let submitting = false;

const $ = (id) => document.getElementById(id);
const MAX_FILE = 40 * 1024 * 1024;

function emptyEntry() { return { name: "", desc: "", shade: null, picture: null, dirty: false }; }

function pushCurrent() {
  if (entries[current] === undefined) return;
  const e = entries[current];
  const wasDirty = e.dirty;
  e.name = $("name").value.trim();
  e.desc = $("desc").value.trim();
  e.dirty = e.name !== "" || e.desc !== "" || e.shade !== null || e.picture !== null;
  if (e.dirty !== wasDirty) renderDots();
}

function addEntry() {
  pushCurrent();
  entries.push(emptyEntry());
  current = entries.length - 1;
  render();
}

function renderDots() {
  const dots = $("dots");
  dots.innerHTML = "";
  entries.forEach((e, i) => {
    const d = document.createElement("button");
    d.type = "button";
    d.className = "dot" + (e.dirty ? " filled" : "") + (i === current ? " active" : "");
    d.title = "Entry " + (i + 1);
    d.onclick = () => goTo(i);
    dots.appendChild(d);
  });
}

function goTo(i) {
  pushCurrent();
  current = i;
  render();
}

function render() {
  const e = entries[current];
  $("name").value = e.name;
  $("desc").value = e.desc;
  setFileBox("shade", e.shade);
  setFileBox("picture", e.picture);
  $("counter").textContent = "Entry " + (current + 1) + " of " + entries.length;
  $("btnBack").disabled = current === 0;
  $("btnNext").disabled = current === entries.length - 1;
  renderDots();
}

function setFileBox(kind, file) {
  const hidden = file === null;
  if (kind === "shade") {
    $("shadeName").textContent = hidden ? "" : file.name;
    $("clearShade").hidden = hidden;
  } else {
    $("picName").textContent = hidden ? "" : file.name;
    $("clearPic").hidden = hidden;
  }
}

function bindDropzone(dzId, inputId, clearId, kind) {
  const dz = $(dzId), input = $(inputId), clear = $(clearId);
  dz.addEventListener("click", () => input.click());
  dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
  dz.addEventListener("drop", (e) => {
    e.preventDefault(); dz.classList.remove("drag");
    if (e.dataTransfer.files.length) setFile(input, kind, e.dataTransfer.files[0]);
  });
  input.addEventListener("change", () => { if (input.files.length) setFile(input, kind, input.files[0]); });
  clear.addEventListener("click", (e) => {
    e.stopPropagation();
    input.value = "";
    entries[current][kind] = null;
    setFileBox(kind, null);
  });
}

function setFile(input, kind, file) {
  if (file.size > MAX_FILE) {
    toast("File too large (max 40MB)", true);
    return;
  }
  entries[current][kind] = file;
  setFileBox(kind, file);
}

function validate() {
  pushCurrent();
  return null;
}

async function submitAll() {
  if (APPS_SCRIPT_URL.includes("REPLACE")) {
    toast("Set your APPS_SCRIPT_URL first (see README.md)", true);
    return;
  }
  const err = validate();
  if (err) { toast(err, true); return; }
  if (submitting) return;
  submitting = true;
  $("submitBtn").disabled = true;
  $("status").textContent = "Submitting " + entries.length + " entr" + (entries.length === 1 ? "y" : "ies") + "...";

  try {
    const payload = { folderId: DRIVE_FOLDER_ID.includes("REPLACE") ? "" : DRIVE_FOLDER_ID, entries: [] };
    for (const e of entries) {
      if (!e.name && !e.desc && !e.shade && !e.picture) continue;
      const record = { name: e.name, desc: e.desc, files: {} };
      if (e.shade) { console.time("base64-shade"); record.files.shade = { name: e.shade.name, type: e.shade.type, data: await toBase64(e.shade) }; console.timeEnd("base64-shade"); }
      if (e.picture) { console.time("base64-picture"); record.files.picture = { name: e.picture.name, type: e.picture.type, data: await toBase64(e.picture) }; console.timeEnd("base64-picture"); }
      payload.entries.push(record);
    }
    if (!payload.entries.length) { toast("No entries to submit.", true); return; }

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 60000);
    try {
      console.time("fetch");
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        signal: controller.signal,
      });
      console.timeEnd("fetch");
      const text = await res.text();
      if (!res.ok) throw new Error("HTTP " + res.status + ": " + text.slice(0, 200));
      const links = safeParse(text);
      toast("Submitted! " + entries.length + " entr" + (entries.length === 1 ? "y" : "ies") + " saved to Drive.", false);
      console.log("Drive links:", links);
      showResults(text);
      $("status").textContent = "Done.";
      setTimeout(() => resetForm(), 1500);
    } finally {
      clearTimeout(timer);
    }
  } catch (ex) {
    console.error(ex);
    toast("Submit " + (ex.name === "AbortError" ? "timed out after 60s (network blocked? re-deployed Apps Script?)" : "failed: " + ex.message), true);
    $("status").textContent = "Failed.";
  } finally {
    submitting = false;
    $("submitBtn").disabled = false;
  }
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function safeParse(t) {
  try { return JSON.parse(t); } catch (_) { return null; }
}

function showResults(text) {
  const data = safeParse(text);
  if (!data || !data.ok) return;
  const box = $("resultsLinks");
  box.innerHTML = "";
  const add = (label, url) => {
    if (!url) return;
    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = label;
    box.appendChild(a);
  };
  add("Log spreadsheet", data.logUrl);
  for (const item of data.items || []) {
    add("Folder: " + item.name, item.url);
    add("  \u2192 Shade", (item.files || {}).shade);
    add("  \u2192 Picture", (item.files || {}).picture);
  }
  $("results").classList.add("show");
}

function resetForm() {
  entries.length = 0;
  entries.push(emptyEntry());
  current = 0;
  $("name").value = ""; $("desc").value = "";
  ["shade", "picture"].forEach((k) => { $(k).value = ""; setFileBox(k, null); });
  render();
}

function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + (isErr ? "err" : "ok");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove("show"), 4000);
}

// init
entries.push(emptyEntry());
bindDropzone("dzShade", "shade", "clearShade", "shade");
bindDropzone("dzPicture", "picture", "clearPic", "picture");
$("btnBack").addEventListener("click", () => goTo(Math.max(0, current - 1)));
$("btnNext").addEventListener("click", () => { pushCurrent(); if (current < entries.length - 1) goTo(current + 1); });
$("btnAdd").addEventListener("click", () => addEntry());
$("form").addEventListener("submit", (e) => { e.preventDefault(); submitAll(); });

const io = new IntersectionObserver((els) => {
  els.forEach((el) => { if (el.isIntersecting) { el.target.classList.add("visible"); io.unobserve(el.target); } });
}, { threshold: 0.08 });
document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

render();
</script>
</body>
</html>
